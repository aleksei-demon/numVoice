<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Числа словами</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            /* background:
                radial-gradient(circle at 20% 20%, rgba(255, 230, 120, .9) 0 12px, transparent 13px),
                radial-gradient(circle at 80% 30%, rgba(255, 230, 120, .8) 0 16px, transparent 17px),
                radial-gradient(circle at 60% 80%, rgba(255, 230, 120, .7) 0 10px, transparent 11px),
                radial-gradient(circle at 10% 75%, rgba(255, 230, 120, .8) 0 14px, transparent 15px),
                linear-gradient(180deg, #8fd3ff, #62b8ff, #8fd3ff); */

            background:
                radial-gradient(circle at 10% 20%, #fff176 5%, transparent 6%),
                radial-gradient(circle at 80% 30%, #fff176 8%, transparent 9%),
                radial-gradient(circle at 20% 80%, #fff176 4%, transparent 5%),
                radial-gradient(circle at 90% 90%, #fff176 10%, transparent 11%),
                linear-gradient(135deg, #e0f7fa, #81d4fa);


            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 700px;
        }

        .input {
            width: 100%;
            border: none;
            outline: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
            background: white;
            color: #333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
            letter-spacing: 2px;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 20px;
            padding: 18px;
            font-size: 28px;
            cursor: pointer;
            background: #ffd84d;
            color: #333;
            font-weight: bold;
            transition: .2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .result {
            margin-top: 25px;
            min-height: 120px;
            background: rgba(255, 255, 255, .9);
            border-radius: 20px;
            padding: 20px;
            font-size: 28px;
            line-height: 1.2;
            text-align: center;
            color: #222;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        @media(max-width:900px) {

            .input,
            .btn,
            .result {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <input id="numberInput" class="input" type="text" inputmode="numeric" autocomplete="off"
            placeholder="Введите число" />

        <button class="btn" id="speakBtn">
            Ответ
        </button>

        <div class="result" id="result"></div>

    </div>

    <script>

        const input = document.getElementById('numberInput');
        const result = document.getElementById('result');
        const btn = document.getElementById('speakBtn');

        // фильтрация + форматирование пробелами
        input.addEventListener('input', () => {
            let digits = input.value.replace(/\D/g, '');
            input.dataset.raw = digits;
            input.value = formatNumber(digits);
        });

        function formatNumber(str) {
            if (!str) return '';
            return str.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }


        // =========================
        // число словами
        // =========================

        const onesMale = [
            '',
            'один',
            'два',
            'три',
            'четыре',
            'пять',
            'шесть',
            'семь',
            'восемь',
            'девять'
        ];

        const onesFemale = [
            '',
            'одна',
            'две',
            'три',
            'четыре',
            'пять',
            'шесть',
            'семь',
            'восемь',
            'девять'
        ];

        const teens = [
            'десять',
            'одиннадцать',
            'двенадцать',
            'тринадцать',
            'четырнадцать',
            'пятнадцать',
            'шестнадцать',
            'семнадцать',
            'восемнадцать',
            'девятнадцать'
        ];

        const tens = [
            '',
            '',
            'двадцать',
            'тридцать',
            'сорок',
            'пятьдесят',
            'шестьдесят',
            'семьдесят',
            'восемьдесят',
            'девяносто'
        ];

        const hundreds = [
            '',
            'сто',
            'двести',
            'триста',
            'четыреста',
            'пятьсот',
            'шестьсот',
            'семьсот',
            'восемьсот',
            'девятьсот'
        ];

        const groups = [
            ['', '', ''],
            ['тысяча', 'тысячи', 'тысяч'],
            ['миллион', 'миллиона', 'миллионов'],
            ['миллиард', 'миллиарда', 'миллиардов'],
            ['триллион', 'триллиона', 'триллионов'],
            ['Квадриллион', 'Квадриллиона', 'Квадриллионов',],
            ['Квинтиллион', 'Квинтиллиона', 'Квинтиллионов',],
            ['Секстиллион', 'Секстиллиона', 'Секстиллионов',],
            ['Септиллион', 'Септиллиона', 'Септиллионов',],
            ['Октиллион', 'Октиллиона', 'Октиллионов',],
            ['Нониллион', 'Нониллиона', 'Нониллионов',],
            ['Дециллион', 'Дециллиона', 'Дециллионов',]
        ];

        function plural(n, forms) {
            n = Math.abs(n) % 100;
            let n1 = n % 10;

            if (n > 10 && n < 20) return forms[2];
            if (n1 > 1 && n1 < 5) return forms[1];
            if (n1 === 1) return forms[0];

            return forms[2];
        }

        function tripletToWords(num, female = false) {

            let words = [];

            let h = Math.floor(num / 100);
            let t = Math.floor((num % 100) / 10);
            let o = num % 10;

            if (h) {
                words.push(hundreds[h]);
            }

            if (t === 1) {
                words.push(teens[o]);
            } else {

                if (t) {
                    words.push(tens[t]);
                }

                if (o) {
                    words.push(
                        female
                            ? onesFemale[o]
                            : onesMale[o]
                    );
                }
            }

            return words.join(' ');
        }

        function numberToWords(number) {

            if (number === '0') return 'ноль';

            let parts = [];
            let chunks = [];

            while (number.length > 0) {
                chunks.unshift(number.slice(-3));
                number = number.slice(0, -3);
            }

            chunks.forEach((chunk, index) => {

                let num = parseInt(chunk);

                if (!num) return;

                let groupIndex = chunks.length - index - 1;

                let female = groupIndex === 1;

                let words = tripletToWords(num, female);

                let groupName = '';

                if (groupIndex > 0) {
                    groupName = plural(num, groups[groupIndex]);
                }

                parts.push(words);

                if (groupName) {
                    parts.push(groupName);
                }
            });

            return parts.join(' ');
        }


        // =========================
        // audio
        // =========================

        function playNumberSounds(text) {

            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            utterance.lang = 'en-US';

            utterance.rate = 0.67;

            utterance.pitch = 1;

            const voices = speechSynthesis.getVoices();

            const voice =
                voices.find(v =>
                    v.lang.includes('en')
                );

            if (voice) {
                utterance.voice = voice;
            }

            speechSynthesis.speak(utterance);
        }

        // =========================
        // кнопка
        // =========================

        btn.addEventListener('click', () => {

            const number = input.dataset.raw || '';

            if (!number) {
                result.textContent = '';
                return;
            }

            const text = numberToWords(number);

            result.textContent = text;

            playNumberSounds(number);
        });

    </script>

</body>

</html>
