<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Числа словами</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background:
                radial-gradient(circle at 10% 20%, #fff176 5%, transparent 6%),
                radial-gradient(circle at 80% 30%, #fff176 8%, transparent 9%),
                radial-gradient(circle at 20% 80%, #fff176 4%, transparent 5%),
                radial-gradient(circle at 90% 90%, #fff176 10%, transparent 11%),
                linear-gradient(135deg, #e0f7fa, #81d4fa);
            display: flex;
            justify-content: center;
            /* оставляем горизонтальное центрирование */
            align-items: flex-start;
            /* содержимое теперь сверху */
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 999px;
        }

        .input {
            width: 100%;
            border: none;
            outline: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 26px;
            text-align: center;
            margin-bottom: 20px;
            margin-top: 20px;
            background: white;
            color: #333;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
            letter-spacing: 2px;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 20px;
            padding: 18px;
            font-size: 22px;
            cursor: pointer;
            background: #ffd84d;
            color: #333;
            font-weight: bold;
            transition: .2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .result {
            margin-top: 25px;
            min-height: 120px;
            background: rgba(255, 255, 255, .9);
            border-radius: 20px;
            padding: 20px;
            font-size: 28px;
            line-height: 1.2;
            text-align: center;
            color: #222;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        #clear {
            background: #fe9d79;
        }

        #speakBtn {
            background: #8ffd71;
        }

        @media(max-width: 999px) {

            .input,
            .btn,
            .result {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="app">
        <button class="btn" id="clear">Сброс</button>

        <input id="numberInput" class="input" type="text" inputmode="numeric" autocomplete="off"
            placeholder="Введите число" />

        <button class="btn" id="speakBtn">Ответ</button>

        <div class="result" id="result"></div>

    </div>

    <script>

        const input = document.getElementById('numberInput');
        const result = document.getElementById('result');
        const btn = document.getElementById('speakBtn');
        const clear = document.getElementById('clear');

        input.addEventListener('input', () => {
            let value = input.value;
            let cleaned = '';
            let i = 0;
            while (i < value.length) {
                let char = value[i];
                if (cleaned === '') {
                    // Первый символ: либо '-' либо цифра
                    if (char === '-') {
                        cleaned += char;
                    } else if (/\d/.test(char)) {
                        cleaned += char;
                    }
                } else {
                    let lastChar = cleaned[cleaned.length - 1];
                    if (/\d/.test(lastChar)) {
                        // После числа разрешен только один знак
                        if (/[+\-*/]/.test(char)) {
                            cleaned += char;
                        } else if (/\d/.test(char)) {
                            cleaned += char;
                        }
                    } else if (/[+\-*/]/.test(lastChar)) {
                        // После знака можно вводить только число
                        if (/\d/.test(char)) {
                            cleaned += char;
                        }
                    }
                }
                i++;
            }
            input.dataset.raw = cleaned;
            input.value = formatNumberForDisplay(cleaned);
        });

        function formatNumberForDisplay(str) {
            // Форматируем только отдельные числа, не трогая знаки операций
            return str.replace(/\d+/g, (match) => match.replace(/\B(?=(\d{3})+(?!\d))/g, ' '));
        }

        // =========================
        // число словами
        // =========================

        const onesMale = [
            '',
            'один',
            'два',
            'три',
            'четыре',
            'пять',
            'шесть',
            'семь',
            'восемь',
            'девять'
        ];

        const onesFemale = [
            '',
            'одна',
            'две',
            'три',
            'четыре',
            'пять',
            'шесть',
            'семь',
            'восемь',
            'девять'
        ];

        const teens = [
            'десять',
            'одиннадцать',
            'двенадцать',
            'тринадцать',
            'четырнадцать',
            'пятнадцать',
            'шестнадцать',
            'семнадцать',
            'восемнадцать',
            'девятнадцать'
        ];

        const tens = [
            '',
            '',
            'двадцать',
            'тридцать',
            'сорок',
            'пятьдесят',
            'шестьдесят',
            'семьдесят',
            'восемьдесят',
            'девяносто'
        ];

        const hundreds = [
            '',
            'сто',
            'двести',
            'триста',
            'четыреста',
            'пятьсот',
            'шестьсот',
            'семьсот',
            'восемьсот',
            'девятьсот'
        ];

        const groups = [
            ['', '', ''],
            ['тысяча', 'тысячи', 'тысяч'],
            ['миллион', 'миллиона', 'миллионов'],
            ['миллиард', 'миллиарда', 'миллиардов'],
            ['триллион', 'триллиона', 'триллионов'],
            ['Квадриллион', 'Квадриллиона', 'Квадриллионов'],
            ['Квинтиллион', 'Квинтиллиона', 'Квинтиллионов'],
            ['Секстиллион', 'Секстиллиона', 'Секстиллионов'],
            ['Септиллион', 'Септиллиона', 'Септиллионов'],
            ['Октиллион', 'Октиллиона', 'Октиллионов'],
            ['Нониллион', 'Нониллиона', 'Нониллионов'],
            ['Дециллион', 'Дециллиона', 'Дециллионов'],
            ['Ундециллион', 'Ундециллиона', 'Ундециллионов'],
            ['Дуодециллион', 'Дуодециллиона', 'Дуодециллионов'],
            ['Тридециллион', 'Тридециллиона', 'Тридециллионов'],
            ['Кваттуордециллион', 'Кваттуордециллиона', 'Кваттуордециллионов'],
            ['Квиндециллион', 'Квиндециллиона', 'Квиндециллионов'],
            ['Сексдециллион', 'Сексдециллиона', 'Сексдециллионов'],
            ['Септендециллион', 'Септендециллиона', 'Септендециллионов'],
            ['Октодециллион', 'Октодециллиона', 'Октодециллионов'],
            ['Новемдециллион', 'Новемдециллиона', 'Новемдециллионов'],
            ['Вигинтиллион', 'Вигинтиллиона', 'Вигинтиллионов'],
            ['Унвигинтиллион', 'Унвигинтиллиона', 'Унвигинтиллионов'],
            ['Дувигинтиллион', 'Дувигинтиллиона', 'Дувигинтиллионов'],
            ['Тревигинтиллион', 'Тревигинтиллиона', 'Тревигинтиллионов'],
            ['Кватторвигинтиллион', 'Кватторвигинтиллиона', 'Кватторвигинтиллионов'],
            ['Квинвигинтиллион', 'Квинвигинтиллиона', 'Квинвигинтиллионов']
        ];

        function plural(n, forms) {
            if (!forms || forms.length < 3) return ''; // защита от undefined
            n = Math.abs(n) % 100;
            let n1 = n % 10;

            if (n > 10 && n < 20) return forms[2];
            if (n1 > 1 && n1 < 5) return forms[1];
            if (n1 === 1) return forms[0];

            return forms[2];
        }

        function tripletToWords(num, female = false) {
            let words = [];

            let h = Math.floor(num / 100);
            let t = Math.floor((num % 100) / 10);
            let o = num % 10;

            if (h) words.push(hundreds[h]);

            if (t === 1) {
                words.push(teens[o]);
            } else {
                if (t) words.push(tens[t]);
                if (o) words.push(female ? onesFemale[o] : onesMale[o]);
            }

            return words.join(' ');
        }

        // =========================
        // число словами и вычисление выражений
        // =========================

        function parseExpression(input) {
            const match = String(input).match(/^(-?\d+)([+\-*/])?(\d+)?$/);

            if (!match) return null;

            return {
                left: BigInt(match[1]),
                operator: match[2] || null,
                right: match[3] ? BigInt(match[3]) : null
            };
        }

        function calculateExpression(left, operator, right) {

            if (!operator || right === null) {
                return left;
            }

            switch (operator) {
                case '+':
                    return left + right;

                case '-':
                    return left - right;

                case '*':
                    return left * right;

                case '/':
                    return right !== 0n ? left / right : null;

                default:
                    return null;
            }
        }

        function splitIntoChunks(numberString) {

            const chunks = [];

            while (numberString.length > 0) {
                chunks.unshift(numberString.slice(-3));
                numberString = numberString.slice(0, -3);
            }

            return chunks;
        }

        function convertChunksToWords(chunks) {

            const parts = [];

            chunks.forEach((chunk, index) => {

                const num = parseInt(chunk, 10);

                if (!num) return;

                const groupIndex = chunks.length - index - 1;

                const female = groupIndex === 1;

                const words = tripletToWords(num, female);

                const groupName = groups[groupIndex]
                    ? plural(num, groups[groupIndex])
                    : '';

                if (words) {
                    parts.push(words);
                }

                if (groupName) {
                    parts.push(groupName);
                }
            });

            return parts.join(' ');
        }

        function numberToWords(input) {

            const parsed = parseExpression(input);

            if (!parsed) {
                return String(input);
            }

            let result = calculateExpression(
                parsed.left,
                parsed.operator,
                parsed.right
            );

            if (result === null) {
                return 'ошибка';
            }

            const negative = result < 0n;

            if (negative) {
                result = -result;
            }

            if (result === 0n) {
                return 'ноль';
            }

            const numberString = result.toString();

            const chunks = splitIntoChunks(numberString);

            const words = convertChunksToWords(chunks);

            return negative
                ? 'минус ' + words
                : words;
        }


        function evaluateExpression(input) {

            const parsed = parseExpression(input);

            if (!parsed) {
                return null;
            }

            return calculateExpression(
                parsed.left,
                parsed.operator,
                parsed.right
            );
        }














        // =========================
        // audio
        // =========================

        function playNumberSounds(text) {
            console.log(result.textContent.length);
            speechSynthesis.cancel();

            let utterance;

            if (text.length > 32 || result.textContent.length > 200) {
                // Слишком длинный текст — "математику сломал!"
                utterance = new SpeechSynthesisUtterance("математику сломал мелкий засранц!");
                utterance.lang = 'ru-RU';
                utterance.rate = 1;       // можно увеличить скорость
                utterance.pitch = 1.5;    // немного выше тон
                utterance.volume = 0.3;
                // можно выбрать голос русскоязычный
                const voices = speechSynthesis.getVoices();
                const voice = voices.find(v => v.lang.includes('ru'));
                if (voice) utterance.voice = voice;

            } else {
                // Обычный текст — оригинальная логика
                utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.67;
                utterance.pitch = 1;
                utterance.volume = 0.3;
                const voices = speechSynthesis.getVoices();
                const voice = voices.find(v => v.lang.includes('en'));
                if (voice) utterance.voice = voice;
            }

            speechSynthesis.speak(utterance);
        }

        clear.addEventListener('click', () => {
            input.value = '';
            input.dataset.raw = '';
            result.innerText = '';
            speechSynthesis.cancel();
            input.focus(); // фокус после нажатия "Сброс"
        });

        // Устанавливаем фокус при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            input.focus();
        });

        // Добавляем фокус после нажатия кнопок
        btn.addEventListener('click', () => {

            const number = input.dataset.raw || '';

            if (!number) {
                result.textContent = '';
                input.focus();
                return;
            }

            // русский текст
            const text = numberToWords(number);

            result.textContent = text;

            // число результата
            const calculated = evaluateExpression(number);

            if (calculated !== null) {
                //  playNumberSounds(calculated.toString());

                let speechText;

                if (calculated < 0n) {
                    speechText = 'negative ' + (-calculated).toString();
                } else {
                    speechText = calculated.toString();
                }

                playNumberSounds(speechText);

            }

            input.focus();
        });

    </script>

</body>

</html>
